services:
  benedict:
    build: .
    container_name: stbenedict
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5050:5050"
    env_file:
      - .env
    networks:
      - benedict
  db:
    image: postgres:13
    ports:
      - "5432:5432"
    container_name: stbenedictdb
    environment:
     POSTGRES_DB: "benedict"
     POSTGRES_USER: "benedict"
     POSTGRES_PASSWORD: "beer"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benedict"]
      interval: 60s
      timeout: 60s
      retries: 5
    volumes:
      - benedict_data:/var/lib/postgresql/data
    networks:
      - benedict

volumes:
  benedict_data:
networks:
  benedict:
    
